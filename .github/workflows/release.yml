name: Release

# 推 v* tag 触发:完整复刻本地发版产物(app + Tray helper + Widget + 稳定身份签名
# + DMG + updater 三件套) + Windows NSIS 安装包,发 draft release——
# 人工检查后 publish 才对 updater 生效。
#
# 所需 secrets:
#   SIGNING_CERT_P12          macOS 签名证书导出的 .p12,base64 编码
#   SIGNING_CERT_PASSWORD     .p12 导出密码
#   TAURI_SIGNING_PRIVATE_KEY updater minisign 私钥(对应 tauri.conf 的 pubkey,双平台共用)
#   APPLE_API_PRIVATE_KEY     App Store Connect Developer API 私钥
# vars.APPLE_API_KEY / vars.APPLE_API_ISSUER 为非机密公开标识。
#
# vars.MACOS_SIGNING_IDENTITY 未配置时沿用稳定自签身份；切换 Developer ID 时
# 只需替换证书 secrets 并设置该变量，App Group 会从证书 Team ID 自动启用。
# Windows 侧无 Authenticode 签名(SmartScreen 会拦,发布期另议),NSIS 本身即
# updater 工件,minisign 签名后写入 latest.json 的 windows-x86_64 条目。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Sign updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          pnpm tauri signer sign $exe.FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  build-macos:
    # 串行等 Windows 工件:latest.json 需并入 windows-x86_64 条目后统一发布
    needs: build-windows
    runs-on: macos-latest
    env:
      SIGN_ID: ${{ vars.MACOS_SIGNING_IDENTITY || 'Monet Signing' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASS="ci-$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          echo "$CERT_P12" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S 'apple-tool:,apple:,codesign:' -s -k "$KEYCHAIN_PASS" build.keychain
          # 自签证书必须进系统信任链,否则 codesign 拒绝用它签名。
          # PEM 从已导入的 keychain 用 security 原生导出——security export 产的 p12
          # 是 RC2-40 老式加密,OpenSSL 3 默认拒解(首跑实败教训),绕开 openssl
          if [ "$SIGN_ID" = "Monet Signing" ]; then
            security find-certificate -c "$SIGN_ID" -p build.keychain > /tmp/cert.pem
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain /tmp/cert.pem
            rm -f /tmp/cert.pem
          fi
          rm -f /tmp/cert.p12
          IDENTITIES=$(security find-identity -v -p codesigning)
          grep -F "$SIGN_ID" <<< "$IDENTITIES" >/dev/null

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm tauri build --bundles app --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$SIGN_ID\"}}}"

      - name: Bundle tray helper
        run: bash scripts/bundle-tray.sh

      - name: Build widget, sign, package
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          APPLE_API_KEY_PATH="$KEY_PATH" src-widget/build.sh

      - name: Verify signature
        run: |
          set -euo pipefail
          APP=src-tauri/target/release/bundle/macos/Monet.app
          codesign --verify --deep --strict "$APP"
          DETAILS=$(codesign -dvv "$APP" 2>&1)
          if grep -F 'Signature=adhoc' <<< "$DETAILS" >/dev/null; then
            echo 'Unexpected ad-hoc signature' >&2
            exit 1
          fi

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: windows-artifacts

      - name: Merge windows into latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL=$(ls src-tauri/target/release/bundle/updater/*.app.tar.gz)
          WIN_EXE=$(ls windows-artifacts/*.exe)
          node scripts/create-latest-json.mjs "$VERSION" "$TARBALL" \
            src-tauri/target/release/bundle/updater/latest.json "$WIN_EXE"
          cat src-tauri/target/release/bundle/updater/latest.json

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to modify its assets." >&2
            exit 1
          fi
          ASSETS=(
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/updater/*.app.tar.gz
            src-tauri/target/release/bundle/updater/*.sig
            src-tauri/target/release/bundle/updater/latest.json
            windows-artifacts/*.exe
            windows-artifacts/*.sig
          )
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --title "Monet ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${ASSETS[@]}"
